# ============================================================
# NGINX UNIFIED CONFIGURATION
# ============================================================
# Handles all services via Cloudflare Tunnel
# Domain: kalijaga.fun
# ============================================================

server {
  listen 80;
  server_name kalijaga.fun;

  client_max_body_size 10m;

  # ============================================================
  # BACKEND API - /api/*
  # ============================================================
  location /api/ {
    proxy_pass http://backend:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_buffering off;
    
    # CORS headers (handled by Flask, but adding backup)
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
  }

  # ============================================================
  # SWAGGER UI - /swaggerui/*
  # ============================================================
  location /swaggerui/ {
    proxy_pass http://backend:5000/swaggerui/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ============================================================
  # PGADMIN - /pgadmin/*
  # ============================================================
  location /pgadmin/ {
    proxy_pass http://pgadmin:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Script-Name /pgadmin;
    
    # WebSocket support for pgAdmin
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Required for pgAdmin to work behind proxy
    proxy_redirect ~^/(.*)$ /pgadmin/$1;
  }

  # ============================================================
  # STATIC ASSETS - Cache optimization
  # ============================================================
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_pragma $http_authorization;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ============================================================
  # FRONTEND - Default route (/)
  # ============================================================
  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_cache_bypass $http_upgrade;
  }
}
