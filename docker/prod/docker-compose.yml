services:
  backend:
    container_name: flask-backend
    build:
      context: ../../backend
    restart: unless-stopped

  frontend:
    container_name: vite-frontend
    build:
      context: ../../frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://192.10.10.154/api}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    container_name: reverse-proxy
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
