<!DOCTYPE html>
<html>
<head>
    <title>Timezone Fix Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🧪 Timezone Fix Test</h1>
    
    <h2>Test Case: UTC Timestamp Parsing</h2>
    
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(title, content, isSuccess) {
            const div = document.createElement('div');
            div.className = `test-result ${isSuccess ? 'success' : 'error'}`;
            div.innerHTML = `<strong>${title}</strong><pre>${content}</pre>`;
            results.appendChild(div);
        }
        
        // Test 1: Backend format with 'Z' suffix
        const backendTimestamp = '2026-01-31T13:34:08.446Z';
        const parsed = new Date(backendTimestamp);
        const now = new Date();
        
        const info = {
            'Backend Timestamp': backendTimestamp,
            'Parsed as UTC': parsed.toISOString(),
            'Current Time UTC': now.toISOString(),
            'Difference (minutes)': ((parsed.getTime() - now.getTime()) / 1000 / 60).toFixed(2),
            'Is Expired?': now > parsed ? 'YES ❌' : 'NO ✅',
            'Timestamp is valid': !isNaN(parsed.getTime()) ? 'YES ✅' : 'NO ❌'
        };
        
        addResult(
            '✅ UTC Timestamp Test',
            JSON.stringify(info, null, 2),
            !isNaN(parsed.getTime())
        );
        
        // Test 2: Old format without timezone (PROBLEMATIC)
        const oldTimestamp = '2026-01-31T13:34:08.446291';
        const parsedOld = new Date(oldTimestamp);
        
        const oldInfo = {
            'Old Timestamp (no timezone)': oldTimestamp,
            'Parsed as (browser interprets as local)': parsedOld.toISOString(),
            'Problem': 'Browser treats it as LOCAL time, not UTC',
            'Solution': 'Backend must send with Z suffix for UTC'
        };
        
        addResult(
            '⚠️ Old Format (Problematic)',
            JSON.stringify(oldInfo, null, 2),
            false
        );
        
        // Test 3: Simulate saveAuthData and isTokenExpired
        function testAuthFlow() {
            const mockResponse = {
                data: {
                    token: 'test-token-123',
                    email: 'test@example.com',
                    name: 'Test User',
                    user_id: 1,
                    expires_at: '2026-01-31T15:00:00.000Z', // 2 hours from ~13:00
                    confidence: 0.95
                }
            };
            
            // Save to localStorage
            localStorage.setItem('tokenExpiry', mockResponse.data.expires_at);
            
            // Check if expired
            const expiryStr = localStorage.getItem('tokenExpiry');
            const expiry = new Date(expiryStr);
            const currentTime = new Date();
            const isExpired = currentTime > expiry;
            
            const flowInfo = {
                'Stored Expiry': expiryStr,
                'Parsed Expiry (UTC)': expiry.toISOString(),
                'Current Time (UTC)': currentTime.toISOString(),
                'Time Remaining (minutes)': ((expiry.getTime() - currentTime.getTime()) / 1000 / 60).toFixed(2),
                'Is Expired?': isExpired ? 'YES ❌' : 'NO ✅'
            };
            
            addResult(
                '✅ Complete Auth Flow Test',
                JSON.stringify(flowInfo, null, 2),
                !isExpired
            );
            
            // Clean up
            localStorage.removeItem('tokenExpiry');
        }
        
        testAuthFlow();
        
        // Test 4: Show timezone info
        const tzInfo = {
            'Browser Timezone': Intl.DateTimeFormat().resolvedOptions().timeZone,
            'UTC Offset': -new Date().getTimezoneOffset() / 60 + ' hours',
            'Note': 'All tokens should be in UTC (Z suffix) to avoid timezone issues'
        };
        
        addResult(
            'ℹ️ Timezone Information',
            JSON.stringify(tzInfo, null, 2),
            true
        );
    </script>
</body>
</html>
